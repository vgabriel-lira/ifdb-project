<article
  (click)="selected.emit()"
  (keydown.enter)="selected.emit()"
  tabindex="0"
  role="button"
  class="group flex h-full cursor-pointer flex-col overflow-hidden rounded-lg border border-zinc-800 bg-zinc-900 transition-colors hover:border-zinc-600 focus:outline-none focus:ring-2 focus:ring-amber-400"
>
  <div class="aspect-[2/3] w-full overflow-hidden bg-black">
    @if (imagemUrl()) {
      <img
        [src]="imagemUrl()"
        [alt]="titulo()"
        class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center text-[10px] font-bold uppercase text-zinc-600">
        Sem capa
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col justify-between gap-3 p-3">
    <div>
      <h3 class="line-clamp-2 text-sm font-bold leading-tight text-white group-hover:text-amber-400">
        {{ titulo() }}
      </h3>
      <p class="mt-1 text-[11px] font-semibold uppercase text-zinc-400">
        {{ genero() || 'Sem gênero' }} · {{ ano() }}
      </p>
    </div>

    @if (canDelete()) {
      <button
        type="button"
        (click)="$event.stopPropagation(); deleteRequested.emit()"
        class="rounded bg-red-500/10 px-2 py-1 text-xs font-bold text-red-400 transition-colors hover:bg-red-600 hover:text-white"
      >
        Excluir
      </button>
    }
  </div>
</article>
